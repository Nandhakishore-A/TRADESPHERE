<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ts-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="ts-glow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Outer orbital ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#ts-grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="140 35" />
  <!-- Inner sphere background -->
  <circle cx="32" cy="32" r="22" fill="#0F172A" />
  <circle cx="32" cy="32" r="22" fill="url(#ts-glow)" />
  <!-- Trading trend & sphere latitude lines -->
  <path d="M14 32 Q32 20 50 32" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" fill="none" />
  <path d="M14 32 Q32 44 50 32" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" fill="none" />
  <!-- Bullish financial trendline -->
  <path d="M20 40 L28 32 L36 36 L44 24" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Peak indicator point -->
  <circle cx="44" cy="24" r="3.5" fill="#34D399" />
</svg>
